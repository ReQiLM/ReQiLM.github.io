name: update-data

on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 00:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest data
        run: |
          BASE="https://raw.githubusercontent.com/czgreat/aramhex-data/main"
          curl -fsSL "$BASE/heroes.json" -o heroes.json
          curl -fsSL "$BASE/augments.json" -o augments.json
          curl -fsSL "$BASE/hero_bundled.json" -o hero_bundled.json
          curl -fsSL "$BASE/latest.json" -o latest.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heroes.json augments.json hero_bundled.json latest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update data $(date -u +%Y-%m-%d)"
          git push
