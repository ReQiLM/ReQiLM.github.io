<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HexRank</title>
<style>
:root{--bg:#0B0F16;--panel:#121824;--card:#1A2230;--border:#2A3442;--text:#E0E4EC;--muted:#7A8294;--accent:#7C6CFF;--S:#FFD54A;--A:#FF7BAA;--B:#A78BFA;--C:#6B7280;--D:#4B5563;--win:#4ADE80;--loss:#F87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

/* top bar */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:52px}
.logo{font-size:18px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:20px}
.nav-links a{color:var(--muted);font-size:14px}
.nav-links a:hover{color:var(--text)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.pill{padding:4px 12px;border-radius:6px;font-size:12px;background:var(--card);color:var(--muted);border:1px solid var(--border)}
.pill .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--win);margin-right:6px}

/* hero strip */
.hero-strip{padding:36px 0 28px;border-bottom:1px solid var(--border)}
.hero-strip h1{font-size:28px;font-weight:800;margin-bottom:8px}
.hero-strip .desc{color:var(--muted);font-size:14px}
.hero-stats{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.hero-stats .st{display:flex;flex-direction:column}
.hero-stats .st .n{font-size:22px;font-weight:800}
.hero-stats .st .l{font-size:11px;color:var(--muted)}

/* search + filters */
.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:14px;outline:none}
.search-box:focus{border-color:var(--accent)}
.sort-btn{padding:8px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--border);color:var(--muted);font-size:13px;cursor:pointer}
.sort-btn.active{color:var(--text);border-color:var(--accent)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .ava{width:44px;height:44px;border-radius:8px;margin:0 auto 8px;display:block;background:var(--card)}
.card .nm{font-size:13px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .wr{font-size:12px;text-align:center;margin-top:4px}
.card .gr{font-size:11px;text-align:center;margin-top:2px;font-weight:700}

/* detail panel */
.detail{display:none;margin-top:24px}
.detail .d-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.detail .d-head img{width:64px;height:64px;border-radius:10px}
.detail .d-head .info h2{font-size:22px;font-weight:800}
.detail .d-head .info .en{color:var(--muted);font-size:13px}
.detail .d-head .metrics{display:flex;gap:24px;margin-top:8px}
.detail .d-head .metrics .m{text-align:center}
.detail .d-head .metrics .m .v{font-size:18px;font-weight:800}
.detail .d-head .metrics .m .k{font-size:11px;color:var(--muted)}
.detail .back{background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;margin-bottom:16px;padding:0;display:inline-block}

/* augment list */
.augments{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.aug{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.aug .grade{font-size:16px;font-weight:800;width:24px;text-align:center}
.aug .nm{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aug .meta{font-size:11px;color:var(--muted)}

/* section label */
.sec-label{font-size:15px;font-weight:700;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.sec-label::before{content:'';width:3px;height:16px;background:var(--accent);border-radius:2px}

/* footer */
footer{border-top:1px solid var(--border);padding:24px 0;margin-top:40px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
footer .links{display:flex;gap:16px;font-size:12px;color:var(--muted)}
footer .copy{font-size:12px;color:var(--muted)}

/* grade colors */
.g-S{color:var(--S)}.g-A{color:var(--A)}.g-B{color:var(--B)}.g-C{color:var(--C)}.g-D{color:var(--D)}
.w-good{color:var(--win)}.w-bad{color:var(--loss)}

/* loading */
#loading{text-align:center;padding:80px;color:var(--muted);font-size:16px}

@media(max-width:640px){
  .nav-links{display:none}
  .hero-strip h1{font-size:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="logo">Hex<span>Rank</span></div>
    <div class="nav-links">
      <a href="#heroes">英雄</a>
      <a href="#about">关于</a>
    </div>
    <div class="right">
      <span class="pill"><span class="dot"></span><span id="patch-ver">—</span></span>
    </div>
  </div>
</div>

<div class="wrap">

<div class="hero-strip" id="heroes">
  <h1>海克斯大乱斗胜率</h1>
  <div class="desc">国服对局统计 · 每周更新 · 数据来自公开数据仓库</div>
  <div class="hero-stats">
    <div class="st"><div class="n" id="st-games">—</div><div class="l">总对局</div></div>
    <div class="st"><div class="n" id="st-heroes">—</div><div class="l">英雄</div></div>
    <div class="st"><div class="n" id="st-aug">—</div><div class="l">海克斯</div></div>
    <div class="st"><div class="n" id="st-update">—</div><div class="l">更新</div></div>
  </div>
</div>

<div class="toolbar">
  <input class="search-box" id="search" placeholder="搜索英雄名或 ID…" />
  <button class="sort-btn active" data-sort="win">胜率</button>
  <button class="sort-btn" data-sort="pick">选取率</button>
  <button class="sort-btn" data-sort="games">场次</button>
  <button class="sort-btn" data-sort="rank">排名</button>
</div>

<div class="grid" id="grid"></div>

<div class="detail" id="detail">
  <button class="back" onclick="hideDetail()">← 返回列表</button>
  <div class="d-head">
    <img id="d-img" alt="" />
    <div class="info">
      <h2 id="d-name"></h2>
      <div class="en" id="d-en"></div>
      <div class="metrics">
        <div class="m"><div class="v" id="d-win"></div><div class="k">胜率</div></div>
        <div class="m"><div class="v" id="d-pick"></div><div class="k">选取率</div></div>
        <div class="m"><div class="v" id="d-games"></div><div class="k">场次</div></div>
        <div class="m"><div class="v" id="d-rank"></div><div class="k">排名</div></div>
      </div>
    </div>
  </div>
  <div class="sec-label">海克斯推荐</div>
  <div class="augments" id="aug-list"></div>
</div>

</div>

<footer id="about">
  <div class="wrap">
    <div class="links">
      <a href="https://github.com/czgreat/aramhex-data">数据仓库</a>
      <a href="https://github.com/czgreat/aramhex">上游项目</a>
    </div>
    <div class="copy">非官方工具，与腾讯、Riot Games 无关</div>
  </div>
</footer>

<script>
let H={},A={},B={},LV={};
let sortBy='win';

async function init(){
  try{
    const [h,a,b,lv]=await Promise.all([
      fetch('heroes.json').then(r=>r.json()),
      fetch('augments.json').then(r=>r.json()),
      fetch('hero_bundled.json').then(r=>r.json()),
      fetch('latest.json').then(r=>r.json()),
    ]);
    H=h;A=a;B=b.heroes||{};LV=lv;
    document.getElementById('st-games').textContent=(Object.values(H).reduce((s,v)=>s+(v.games||0),0)/10/10000).toFixed(0)+'万';
    document.getElementById('st-heroes').textContent=Object.keys(H).length;
    document.getElementById('st-aug').textContent=Object.keys(A).length;
    const snap=(LV.snapshot_at||'').slice(0,10);
    document.getElementById('st-update').textContent=snap||'—';
    const patch=(LV.patch||'').split('.').slice(-1)[0];
    document.getElementById('patch-ver').textContent='v'+(patch||'?');
    render();
  }catch(e){
    document.getElementById('grid').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">加载失败：'+e.message+'</div>';
  }
}

function tierOf(hid){
  const b=B[hid];if(!b||!b.augments)return null;
  const t={};
  for(const a of b.augments){const t2=a.tier||a.overall_tier;if(t2)t[t2]=(t[t2]||0)+1}
  return t.S?'S':t.A?'A':t.B?'B':t.C?'C':t.D?'D':null;
}

function render(filter=''){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  let keys=Object.keys(H);
  if(filter){keys=keys.filter(k=>H[k].name.includes(filter)||k.includes(filter))}
  keys.sort((a,b)=>{
    if(sortBy==='win')return (H[b].win_rate||0)-(H[a].win_rate||0);
    if(sortBy==='pick')return (H[b].pick_rate||0)-(H[a].pick_rate||0);
    if(sortBy==='games')return (H[b].games||0)-(H[a].games||0);
    if(sortBy==='rank')return (H[a].rank||999)-(H[b].rank||999);
  });
  for(const hid of keys){
    const h=H[hid];
    const t=tierOf(hid);
    const div=document.createElement('div');
    div.className='card';
    div.dataset.id=hid;
    const win=(h.win_rate||0)*100;
    const wrCls=win>=50?'w-good':'w-bad';
    const icon=h.icon||('https://game.gtimg.cn/images/lol/act/img/champion/'+(h.name||hid)+'.png');
    div.innerHTML=`<img class="ava" src="${icon}" onerror="this.style.background='var(--card)';this.style.display='flex';this.style.alignItems='center';this.style.justifyContent='center';this.textContent='?';this.style.fontSize='16px';this.style.color='var(--muted)'">
      <div class="nm">${h.name||hid}</div>
      <div class="wr ${wrCls}">${win.toFixed(1)}%</div>
      ${t?`<div class="gr g-${t}">${t}</div>`:''}`;
    div.onclick=()=>showDetail(hid);
    grid.appendChild(div);
  }
}

function showDetail(hid){
  const h=H[hid];const b=B[hid]||{};
  document.getElementById('detail').style.display='block';
  document.getElementById('d-name').textContent=h.name||hid;
  document.getElementById('d-en').textContent=hid;
  const icon=h.icon||('https://game.gtimg.cn/images/lol/act/img/champion/'+(h.name||hid)+'.png');
  document.getElementById('d-img').src=icon;
  document.getElementById('d-img').onerror=function(){this.style.background='var(--card)';this.style.display='flex';this.style.alignItems='center';this.style.justifyContent='center';this.textContent='?';this.style.fontSize='20px';this.style.color='var(--muted)'};
  document.getElementById('d-win').textContent=((h.win_rate||0)*100).toFixed(1)+'%';
  document.getElementById('d-pick').textContent=((h.pick_rate||0)*100).toFixed(1)+'%';
  document.getElementById('d-games').textContent=h.games?(h.games/10000).toFixed(1)+'万':'—';
  document.getElementById('d-rank').textContent=h.rank||'—';

  const augBox=document.getElementById('aug-list');
  augBox.innerHTML='';
  const augList=(b.augments||[]).filter(a=>a.tier||a.overall_tier).sort((a,b)=>{
    const o={S:0,A:1,B:2,C:3,D:4};
    return (o[a.tier||a.overall_tier]||9)-(o[b.tier||b.overall_tier]||9);
  }).slice(0,30);
  for(const a of augList){
    const name=A[a.id]?.name||a.id;
    const tier=a.tier||a.overall_tier;
    const pick=a.pick?(a.pick*100).toFixed(1)+'%':'';
    const rank=a.rank?'#'+a.rank:'';
    const div=document.createElement('div');
    div.className='aug';
    div.innerHTML=`<div class="grade g-${tier}">${tier}</div>
      <div class="nm">${name}</div>
      <div class="meta">${pick} ${rank}</div>`;
    augBox.appendChild(div);
  }
  document.getElementById('detail').scrollIntoView({behavior:'smooth'});
}

function hideDetail(){
  document.getElementById('detail').style.display='none';
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
}

document.getElementById('search').addEventListener('input',e=>{
  hideDetail();render(e.target.value.trim());
});
document.querySelectorAll('.sort-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    sortBy=btn.dataset.sort;
    hideDetail();
    render(document.getElementById('search').value.trim());
  };
});

init();
</script>
</body>
</html>
